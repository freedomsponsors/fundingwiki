# Include these locations in the existing TLS server block for funding.wiki.
# The backend address must match the app-server address reachable by that Nginx.
location = /doc {
    return 301 /doc/;
}

location ^~ /doc/ {
    proxy_pass http://192.168.25.203:8080;
    proxy_set_header Host funding.wiki;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /w/ {
    proxy_pass http://192.168.25.203:8080;
    proxy_set_header Host funding.wiki;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /images/ {
    proxy_pass http://192.168.25.203:8080;
    proxy_set_header Host funding.wiki;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://192.168.25.203:8000;
    proxy_set_header Host funding.wiki;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
