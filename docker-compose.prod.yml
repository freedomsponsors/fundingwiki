## Production
  app:
    image: fundingwiki-app:latest
    restart: unless-stopped
    # image already has the code in app, no need to bind /workspace
    # image also has gunicorn command by default
    ports:
      - "192.168.25.203:8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: djangology
      DATABASE_USER: djangology
      DATABASE_PASS: djangology
      REDIS_HOST: redis
      MEDIAWIKI_INTERNAL_API_URL: ${MEDIAWIKI_INTERNAL_API_URL:-http://mediawiki/w/api.php}
      MEDIAWIKI_API_HOST: ${MEDIAWIKI_API_HOST:-funding.wiki}
      MEDIAWIKI_COOKIE_PREFIX: ${MEDIAWIKI_COOKIE_PREFIX:-mediawiki}
      MEDIAWIKI_CACHE_TTL: ${MEDIAWIKI_CACHE_TTL:-20}
      MEDIAWIKI_API_TIMEOUT: ${MEDIAWIKI_API_TIMEOUT:-2}
      MEDIAWIKI_ADMIN_GROUP: ${MEDIAWIKI_ADMIN_GROUP:-sysop}
      MEDIAWIKI_SERVER_URL: ${MEDIAWIKI_SERVER_URL:-https://funding.wiki}
    env_file:
      - .env.production
    volumes:
      - media_data:/app/media
    networks:
      - default
      - mediawiki_internal
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - "192.168.25.203:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: djangology
      POSTGRES_USER: djangology
      POSTGRES_PASSWORD: djangology

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

networks:
  mediawiki_internal:
    external: true
    name: fundingwiki_mediawiki_net
